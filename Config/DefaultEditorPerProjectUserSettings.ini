; Seeds the project default for per-user editor settings on a fresh checkout (this file only
; supplies a default - a developer's own Saved/Config/<Platform>/EditorPerProjectUserSettings.ini
; still overrides it once they touch the setting themselves).

[/Script/UnrealEd.LevelEditorPlaySettings]
; The ship is flown with the mouse (virtual joystick, see ASOLShipPawn::NotifyControllerChanged),
; which only works once PIE gives the game mouse control immediately. The engine default is False,
; which leaves the OS cursor visible and un-captured until the viewport is clicked - distracting and
; easy to mistake for a game bug on a first PIE session.
GameGetsMouseControl=True
